# Configuração do Auth do projeto Supabase de produção, aplicada com:
#   supabase config diff --workdir supabase-prod --remote=<ref>
#   supabase config push --workdir supabase-prod --remote=<ref>
#
# O `config push` só altera o que este arquivo declara. Não use o
# supabase/config.toml da raiz contra a nuvem: ele tem valores do ambiente
# local (site_url em 127.0.0.1, confirmação de e-mail e MFA desligados,
# URLs do flavor dev).
project_id = "radar-familiar"

[auth]
additional_redirect_urls = ["br.com.radarfamiliar://login-callback"]

# Google OAuth: client Web do Google Cloud (ID + secret) no painel ou via
# scripts/supabase/push-prod-google.ps1. skip_nonce_check ajuda no fluxo móvel.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true

[auth.email]
enable_confirmations = true
otp_length = 6
otp_expiry = 3600

# No plano Free, o Supabase só aceita templates próprios com SMTP próprio.
# Aplique com scripts/supabase/push-prod-auth.ps1 (docs/supabase-prod.md), que
# confere a senha e o remetente antes do push.
#
# pass: a CLI troca env(NOME) pelo valor da variável NOME do ambiente. Se ela
# não existir, envia vazio e a API responde 401 "Missing SMTP_PASS".
# admin_email: remetente de um domínio verificado no provedor (não @gmail.com).
# Brevo: host "smtp-relay.brevo.com", port 587, user = login SMTP do Brevo.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
admin_email = "onboarding@resend.dev"
sender_name = "Radar Familiar"

[auth.email.template.magic_link]
subject = "Seu código do Radar Familiar"
content_path = "./supabase/templates/otp.html"

[auth.email.template.confirmation]
subject = "Seu código do Radar Familiar"
content_path = "./supabase/templates/otp.html"
